name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install Dependencies
      run: |
        npm install
        npm --prefix backend install
        
    - name: Type Check
      run: npm run check:backend
      
    - name: Lint
      run: npm run lint
      
    - name: Run Backend Tests
      run: npm run test:v2
      env:
        OPD_OG_PILOT_ONLY: 'false'
        
    - name: Build Frontend
      run: npm run build
