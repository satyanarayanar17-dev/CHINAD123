# Reviewable controlled-pilot candidate. Creates separate resources; never overwrites the demo.
# Provision only after spend and Singapore region are approved. No demo seed at startup.
databases:
  - name: chettinad-pilot-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    databaseName: chettinad_pilot
    user: chettinad
    ipAllowList: []
services:
  - type: web
    name: chettinad-pilot-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: codex/controlled-pilot-completion
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: off
    disk:
      name: private-clinical-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: TRUST_PROXY, value: "1"}
      - {key: NODE_VERSION, value: "24"}
      - {key: APP_ENV, value: restricted_web_pilot}
      - {key: DB_DIALECT, value: postgres}
      - key: DATABASE_URL
        fromDatabase: {name: chettinad-pilot-db, property: connectionString}
      - {key: DATABASE_SSL, value: "true"}
      - {key: DATABASE_TLS_MODE, value: render_private}
      - {key: PGPOOL_MAX, value: "5"}
      - {key: PERSISTENT_DATA_ROOT, value: /var/data}
      - {key: PATIENT_DOCUMENT_STORAGE_PATH, value: /var/data/patient-documents}
      - {key: COOKIE_SAME_SITE, value: none}
      - {key: COOKIE_SECURE, value: "true"}
      - {key: CORS_ORIGIN, value: "https://chettinad-pilot-web.onrender.com"}
      - {key: OPD_DEMO_OTP, value: "false"}
      - {key: OTP_DELIVERY_PROVIDER, value: msg91}
      - {key: OPD_NOTIFICATION_WORKER, value: "false"}
      - {key: ENABLE_LEGACY_API, value: "false"}
      - {key: PILOT_AUTH_BYPASS, value: "false"}
      - {key: ALLOW_SEED_RESET, value: "false"}
      - {key: OPD_OG_PILOT_ONLY, value: "true"}
      - {key: OPD_PILOT_DEPARTMENT_PREFIX, value: OBST}
      - {key: CLINICAL_RULES_APPROVED, value: "false"}
      - {key: JWT_SECRET, generateValue: true}
      - {key: BACKUP_ENCRYPTION_KEY, sync: false}
      - {key: BOOTSTRAP_ADMIN_ID, sync: false}
      - {key: BOOTSTRAP_ADMIN_NAME, sync: false}
      - {key: BOOTSTRAP_ADMIN_PASSWORD, sync: false}
      - {key: MSG91_AUTH_KEY, sync: false}
      - {key: MSG91_TEMPLATE_ID, sync: false}
      - {key: MSG91_OTP_VARIABLE, sync: false}
  - type: web
    name: chettinad-pilot-web
    runtime: static
    branch: codex/controlled-pilot-completion
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - {key: NODE_VERSION, value: "24"}
      - {key: VITE_API_BASE_URL, value: "https://chettinad-pilot-api.onrender.com/api/v1"}
    routes:
      - {type: rewrite, source: "/*", destination: /index.html}
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://chettinad-pilot-api.onrender.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - {path: "/*", name: X-Frame-Options, value: DENY}
      - {path: "/*", name: X-Content-Type-Options, value: nosniff}
      - {path: "/*", name: Referrer-Policy, value: no-referrer}
      - {path: "/*", name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=()"}
      - {path: "/*", name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains"}
