services:
  - type: web
    name: chettinad-care-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm rebuild sqlite3 --build-from-source
    startCommand: npm run migrate && node opd/demo.cjs && node server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_ENV
        value: development
      - key: DB_DIALECT
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/connected-opd.db
      - key: PATIENT_DOCUMENT_STORAGE_PATH
        value: /tmp/patient-documents
      - key: OPD_DEMO_OTP
        value: "true"
      - key: OTP_DELIVERY_PROVIDER
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://chettinad-care-web.onrender.com"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: chettinad-care-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://chettinad-care-api.onrender.com/api/v1"

    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://chettinad-care-api.onrender.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
      - {path: "/*", name: X-Frame-Options, value: DENY}
      - {path: "/*", name: X-Content-Type-Options, value: nosniff}
      - {path: "/*", name: Referrer-Policy, value: no-referrer}
