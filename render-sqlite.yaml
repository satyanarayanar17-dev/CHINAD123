services:
  - type: web
    name: chettinad-care-api
    env: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: data-volume
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: sqlite
      - key: SQLITE_PATH
        value: /data/connected-opd.db
      - key: PATIENT_DOCUMENT_STORAGE_PATH
        value: /data/patient-documents
      - key: OPD_DEMO_OTP
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://chettinad-care-web.onrender.com"
      - key: COOKIE_SAME_SITE
        value: "none"
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: chettinad-care-web
    env: static
    region: singapore
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://chettinad-care-api.onrender.com/api/v1"
